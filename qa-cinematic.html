<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Geçici arşiv QA</title><style>body{margin:0;background:#ddd;font:14px system-ui;color:#111}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:16px}button,select{padding:10px}#stage{padding:12px;overflow:auto}iframe{display:block;margin:auto;border:0;background:#fff;height:1100px}pre{white-space:pre-wrap;padding:12px}label{display:flex;gap:6px;align-items:center}</style></head><body><header><h1>Geçici arşiv QA</h1><label>Sayfa<select id="page"><option value="irade-terbiyesi.html">İrade Terbiyesi</option><option value="dusunce-arsivi.html">Arşiv</option><option value="index.html">Ana sayfa</option><option value="machiavelli.html">Machiavelli</option></select></label><label>Genişlik<select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select></label><label>Tema<select id="theme"><option value="dark">Koyu</option><option value="light">Açık</option></select></label><label><input id="nojs" type="checkbox">JavaScript kapalı</label><label><input id="reduced" type="checkbox">Hareket azaltma emülasyonu</label><button id="snapshot">Hareket kaydını göster</button><button id="story0">Fikir sahnesi</button><button id="story1">Deney sahnesi</button><button id="story2">Sonuç sahnesi</button><button id="show">Görüntüle</button><button id="matrix">48 düzeni kontrol et</button></header><pre id="result" role="status">Hazır</pre><div id="stage"><iframe id="preview" title="Site önizlemesi" src="irade-terbiyesi.html" style="width:390px"></iframe></div><script>
const byId = id => document.getElementById(id);
let frame = byId('preview');
async function load(page, width, theme, nojs = false) {
  const next = document.createElement('iframe'); next.id = 'preview'; next.title = 'Site önizlemesi'; next.style.width = width + 'px';
  if (nojs) next.setAttribute('sandbox', 'allow-same-origin');
  const loaded = new Promise((resolve, reject) => { next.onload = resolve; next.onerror = reject; });
  next.src = page; frame.replaceWith(next); frame = next; await loaded;
  const doc = frame.contentDocument; doc.documentElement.dataset.theme = theme;
  await doc.fonts.ready; await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  await Promise.allSettled(doc.getAnimations().map(a=>a.finished));
  return doc;
}
function inspect(doc) {
  const width = doc.documentElement.clientWidth;
  const overflow = [...doc.querySelectorAll('main *, .site-header *')].filter(el => {
    if (!el.getClientRects().length) return false;
    const r = el.getBoundingClientRect(); return r.right > width + 1 || r.left < -1;
  }).map(el => el.tagName + '.' + el.className).slice(0, 8);
  const small = [...doc.querySelectorAll('button,input,select,.site-header nav a')].filter(el => el.getClientRects().length && el.getBoundingClientRect().height < 43).map(el => el.id || el.textContent.trim());
  return {width, documentWidth: doc.documentElement.scrollWidth, overflow, smallControls: small, h1: doc.querySelector('h1')?.textContent, hiddenMain: doc.querySelector('main')?.getBoundingClientRect().height === 0};
}
byId('show').onclick = async () => { const doc = await load(byId('page').value, +byId('width').value, byId('theme').value, byId('nojs').checked); byId('result').textContent = JSON.stringify(inspect(doc)); };
byId('snapshot').onclick=()=>{
  const d=frame.contentDocument;
  byId('result').textContent=JSON.stringify({scene:d.querySelector('[data-story]')?.dataset.scene,selected:d.querySelector('[data-selected-entry]')?.dataset.selectedEntry,animations:frame.contentWindow.__motionLog,active:d.getAnimations().length},null,2);
};
for(let i=0;i<3;i++)byId('story'+i).onclick=()=>frame.contentDocument.querySelectorAll('[data-story-scene]')[i]?.scrollIntoView({block:'center',behavior:'instant'});
byId('matrix').onclick = async () => {
  const results = []; byId('matrix').disabled = true;
  try {
    for (const page of ['irade-terbiyesi.html','index.html','dusunce-arsivi.html','machiavelli.html']) for (const width of [320,360,390,430,768,1440]) for (const theme of ['dark','light']) {
      const doc = await load(page, width, theme); const row = {page, requestedWidth: width, theme, ...inspect(doc)}; results.push(row);
      byId('result').textContent = `Kontrol: ${results.length}/48`;
    }
    byId('result').textContent = JSON.stringify({total: results.length, failed: results.filter(r => r.overflow.length || r.smallControls.length || r.hiddenMain || r.documentWidth > r.width + 1), results}, null, 2);
  } catch (error) { byId('result').textContent = String(error); }
  byId('matrix').disabled = false;
};
</script></body></html>
