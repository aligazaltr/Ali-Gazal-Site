<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ali Gazal | Tarayıcı denetimi</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#333630;color:#fff8eb;font:14px system-ui}
form{padding:.55rem 1rem;display:flex;flex-wrap:wrap;gap:.55rem;align-items:end}
label{display:grid;gap:.2rem} button,select{font:inherit;min-height:2.25rem}
#status{margin:.4rem 1rem} #stage{overflow:hidden;margin:auto;position:relative} iframe{position:absolute;transform-origin:top left;border:0;background:#f6f2e9}
pre{max-height:16rem;overflow:auto;margin:1rem;color:#fff8eb}
</style>
<form>
<label>Sayfa<select id="page">
<option value="home">Ana sayfa</option><option value="projects">Projeler</option><option value="prens">Machiavelli</option>
<option value="control">Kontrol Bende mi?</option><option value="payot">İrade Terbiyesi</option><option value="archive">Düşünce Arşivi</option>
<option value="about">Hakkımda</option><option value="archived">Marcus Aurelius</option><option value="missing">404</option>
</select></label>
<label>Sürüm<select id="version"><option value="after">Yeni</option><option value="before">Önceki</option></select></label>
<label>Ekran<select id="size"><option value="1440">1440 × 900</option><option value="1920">1920 × 1080</option><option value="320">320 × 720</option><option value="360">360 × 800</option><option value="390">390 × 844</option><option value="430">430 × 932</option></select></label>
<label>Tema<select id="theme"><option value="light">Açık</option><option value="dark">Koyu</option></select></label>
<label>Bölüm<select id="part"><option value="top">İlk ekran</option><option value="detail">Ana içerik</option><option value="mid">Orta</option><option value="end">Son</option></select></label>
<button type="submit">Sayfayı göster</button><button type="button" id="matrix">Ekran denetimini çalıştır</button>
</form>
<p id="status" role="status">Hazır.</p>
<div id="stage"></div><pre id="result" hidden></pre>
<script defer src="/qa-redesign.js"></script>
</html>
