<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Geçici önizleme kontrolü</title>
  <style>
    body { margin: 0; padding: 12px; font: 14px system-ui; background: #ddd; color: #111; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    label { display: grid; gap: 4px; }
    select, button { min-height: 36px; font: inherit; }
    iframe { display: block; width: 390px; height: 900px; border: 1px solid #555; }
  </style>
</head>
<body>
  <h1>Geçici önizleme kontrolü</h1>
  <form id="controls">
    <label>Sayfa<select id="page">
      <option value="/">Ana sayfa</option><option value="/rehberler">Projeler</option>
      <option value="/hakkimda">Hakkımda</option><option value="/machiavelli">Machiavelli</option>
      <option value="/404">404</option><option value="/marcus-aurelius">Marcus arşivi</option>
      <option value="/olmayan-denetim-sayfasi">Bilinmeyen adres</option>
    </select></label>
    <label>Genişlik<select id="width">
      <option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1440</option>
    </select></label>
    <label>Senaryo<select id="scenario">
      <option value="normal">Normal</option><option value="nojs">JavaScript kapalı</option>
      <option value="deny">Kopyalama reddi</option><option value="cancel">Paylaşımı iptal etme</option>
    </select></label>
    <button type="submit">Görünümü yükle</button>
  </form>
  <p id="result" role="status">Önizleme yükleniyor.</p>
  <iframe id="test-frame" title="Site önizlemesi" src="/" sandbox="allow-scripts allow-same-origin"></iframe>
  <script>
    const frame = document.querySelector('#test-frame');
    const page = document.querySelector('#page');
    const width = document.querySelector('#width');
    const scenario = document.querySelector('#scenario');
    const result = document.querySelector('#result');
    frame.addEventListener('load', () => {
      const view = frame.contentWindow;
      if (scenario.value === 'deny') {
        Object.defineProperty(view.navigator, 'share', { configurable: true, value: undefined });
        Object.defineProperty(view.navigator, 'clipboard', { configurable: true, value: { writeText: () => Promise.reject(new Error('Test-only denial')) } });
        view.document.execCommand = () => false;
      } else if (scenario.value === 'cancel') {
        Object.defineProperty(view.navigator, 'share', { configurable: true, value: () => Promise.reject(new view.DOMException('Test-only cancellation', 'AbortError')) });
      }
      result.textContent = `${width.value} px · ${scenario.options[scenario.selectedIndex].text} · ${view.location.pathname}`;
    });
    document.querySelector('#controls').addEventListener('submit', event => {
      event.preventDefault();
      frame.style.width = `${width.value}px`;
      frame.setAttribute('sandbox', scenario.value === 'nojs' ? 'allow-same-origin' : 'allow-scripts allow-same-origin');
      result.textContent = 'Önizleme yükleniyor.';
      frame.src = `${page.value}?qa=${Date.now()}`;
    });
  </script>
</body>
</html>
