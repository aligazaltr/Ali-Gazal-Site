<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kontrol / tasarım incelemesi</title><style>body{margin:0;background:#242019;color:#f6f2ea;font:14px/1.5 system-ui}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#ffa148}button,select,input{font:inherit;padding:8px;border:1px solid #888;border-radius:3px}button{cursor:pointer}#result{white-space:pre-wrap;max-height:150px;overflow:auto;margin:0;padding:10px 20px;font:11px monospace}#viewport{position:relative;margin:0 auto;overflow:hidden}iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#0b0b0a}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px}.thumbs img{width:100%;height:auto}.thumbs figure{margin:0}h1{font-size:16px;margin:0}.capture header,.capture #result,.capture .thumbs{display:none}</style><script src="control-qa.js" defer></script></head><body><header><h1>Kontrol / inceleme</h1><label>Açılış <select id="variant"><option value="kontrol-bende-mi">1 · Editorial Control</option><option value="control-alternative">2 · Cinematic Control</option><option value="rehberler">Proje dizini</option></select></label><label>Genişlik <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Tema <select id="theme"><option>dark</option><option>light</option></select></label><label>İlerleme <input id="progress" type="number" min="0" max="1" step=".05" value="0" style="width:55px"></label><button id="show">Göster</button><button id="paint">İlerle</button><button id="matrix">28 ekran/tema testi</button><button id="fallback">Geri dönüş testleri</button><button id="details">Bölüm / klavye testi</button></header><pre id="result" role="status">Yükleniyor…</pre><div id="viewport"><iframe id="preview" title="Gerçek sayfa önizlemesi"></iframe></div><section class="thumbs" aria-label="Kapak taslakları"><figure><img src="thumbnail-A.png" alt="A — Fotoğraf bekleyen belgesel kapak taslağı"><figcaption>A / Gerçek portre bekleniyor.</figcaption></figure><figure><img src="thumbnail-C.png" alt="C — Minimal tipografik kapak taslağı"><figcaption>C / Minimal tipografi. Final kapak değil.</figcaption></figure></section></body></html>
