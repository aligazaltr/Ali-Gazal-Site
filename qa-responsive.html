<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Geçici responsive QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; background: #24211d; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 390px 768px; gap: 1rem; align-items: start; }
    section { min-width: 0; }
    h1, h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    iframe { display: block; width: 100%; height: 850px; border: 2px solid #ff861f; background: #fff; }
  </style>
</head>
<body>
  <h1>Geçici PR önizleme kalite sayfası</h1>
  <main>
    <section>
      <h2>390 px · dar telefon</h2>
      <iframe name="phone" title="390 piksel Machiavelli önizlemesi" src="machiavelli.html"></iframe>
    </section>
    <section>
      <h2>768 px · tablet</h2>
      <iframe name="tablet" title="768 piksel Machiavelli önizlemesi" src="machiavelli.html"></iframe>
    </section>
  </main>
</body>
</html>
