<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>4.0 tarayıcı kontrolü</title><style>body{margin:0;background:#d8d8d8;color:#171717;font:13px system-ui}header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px}h1{font-size:14px;margin:0}label{display:flex;gap:4px;align-items:center}button,select{font:inherit;padding:8px}#stage{overflow:auto;padding:8px}iframe{display:block;margin:auto;border:0;height:740px;background:#eee}#result{max-height:135px;overflow:auto;white-space:pre-wrap;padding:8px;margin:0;font:11px monospace}body.clean header,body.clean #result{display:none}body.clean #stage{padding:10px}</style></head><body><header><h1>4.0 · Gerçek tarayıcı</h1><label>Sayfa<select id="page"><option value="index.html">Ana sayfa</option><option value="qa-baseline.html">3.0 başlangıç</option><option value="dusunce-arsivi.html">Arşiv</option><option value="hakkimda.html">Hakkımda</option><option value="machiavelli.html">Machiavelli</option><option value="irade-terbiyesi.html">İrade</option><option value="rehberler.html">Projeler</option></select></label><label>Genişlik<select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Yükseklik<select id="height"><option>480</option><option>640</option><option selected>740</option><option>900</option></select></label><label>Tema<select id="theme"><option value="dark">Koyu</option><option value="light">Açık</option></select></label><label><input id="nojs" type="checkbox">JS kapalı</label><label><input id="reduced" type="checkbox">Azaltılmış hareket (JS)</label><label><input id="mockshare" type="checkbox">Paylaşım test kaydı</label><button id="show">Görüntüle</button><button id="matrix">96 düzen</button><button id="snapshot">Durumu kaydet</button><button id="story0">01</button><button id="story1">02</button><button id="story2">03</button><button id="discovery">Keşif alanı</button><button id="scenes">Sahne denetimi</button><button id="nojs-audit">JS kapalı denetim</button><button id="metrics">Önce/sonra ölçümü</button><button id="behavior">Arşiv davranış testleri</button><button id="clean">Sade görünüm</button></header><pre id="result" role="status">Hazır</pre><div id="stage"><iframe id="preview" title="Site önizlemesi" src="index.html" style="width:405px"></iframe></div><script>
const el=id=>document.getElementById(id);let frame=el('preview');
const settle=async doc=>{await doc.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await Promise.allSettled(doc.getAnimations().map(a=>a.finished));};
async function size(width,height,theme,fast=false){frame.style.width=width+'px';frame.style.height=height+'px';const d=frame.contentDocument;d.documentElement.dataset.theme=theme;if(!fast)await settle(d);const gutter=width-d.documentElement.clientWidth;if(gutter){frame.style.width=(width+gutter)+'px';if(!fast)await settle(d);}return d;}
async function load(page,width,theme,nojs=false){localStorage.setItem('ag-theme',theme);const next=document.createElement('iframe');next.id='preview';next.title='Site önizlemesi';next.style.width=width+'px';next.style.height=el('height').value+'px';if(nojs)next.setAttribute('sandbox','allow-same-origin');const ready=new Promise((resolve,reject)=>{next.onload=resolve;next.onerror=reject});next.src=page;frame.replaceWith(next);frame=next;await ready;return size(width,+el('height').value,theme);}
function inspect(d){const w=d.documentElement.clientWidth;return{width:w,height:d.defaultView.innerHeight,documentWidth:d.documentElement.scrollWidth,overflow:[...d.querySelectorAll('main *, .site-header *, .preview-notice *')].filter(e=>{if(!e.getClientRects().length)return false;const r=e.getBoundingClientRect();return r.right>w+1||r.left< -1}).map(e=>e.tagName+'.'+e.className).slice(0,8),small:[...d.querySelectorAll('button,input,select,summary,.site-header nav a')].filter(e=>e.getClientRects().length&&e.getBoundingClientRect().height<43).map(e=>e.id||e.textContent.trim()),hiddenMain:d.querySelector('main').getBoundingClientRect().height===0};}
el('show').onclick=async()=>{const d=await load(el('page').value,+el('width').value,el('theme').value,el('nojs').checked);el('result').textContent=JSON.stringify(inspect(d));};
el('matrix').onclick=async()=>{el('matrix').disabled=true;const rows=[];const saved=el('reduced').checked;el('reduced').checked=true;try{for(const page of ['index.html','dusunce-arsivi.html','hakkimda.html','machiavelli.html','irade-terbiyesi.html','rehberler.html']){await load(page,390,'dark');for(const width of [320,360,375,390,430,768,1024,1440])for(const theme of ['dark','light']){const d=await size(width,740,theme,true);rows.push({page,requestedWidth:width,theme,...inspect(d)});el('result').textContent=JSON.stringify({progress:rows.length,total:96});}}el('result').textContent=JSON.stringify({total:rows.length,failed:rows.filter(r=>r.overflow.length||r.small.length||r.hiddenMain||r.documentWidth>r.width+1),rows});}catch(e){el('result').textContent=String(e)}el('reduced').checked=saved;el('matrix').disabled=false;};
el('snapshot').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,s=d.querySelector('[data-story]'),card=d.querySelector('[data-selected-entry]');el('result').textContent=JSON.stringify({url:w.location.href,layout:inspect(d),storyMode:s?.dataset.storyMode,scene:s?.dataset.scene,stageDisplay:s?getComputedStyle(s.querySelector('.story-visual')).display:null,selected:card?.dataset.selectedEntry,cardBox:card?.getBoundingClientRect().toJSON(),focus:d.activeElement?.outerHTML.slice(0,250),canonical:d.querySelector('[rel=canonical]')?.href,animations:w.__motionLog,active:d.getAnimations().length,shares:w.__shareLog,errors:w.__pageErrors,performance:w.__vitals});};
for(let i=0;i<3;i++)el('story'+i).onclick=()=>frame.contentDocument.querySelectorAll('[data-story-scene]')[i]?.scrollIntoView({block:'start',behavior:'instant'});
el('discovery').onclick=()=>frame.contentDocument.querySelector('[data-archive-discovery]')?.scrollIntoView({block:'start',behavior:'instant'});
el('clean').onclick=()=>document.body.classList.toggle('clean');
el('behavior').onclick=async()=>{const d=frame.contentDocument,w=frame.contentWindow,rows=[];const check=(name,ok)=>rows.push({name,passed:!!ok});const input=d.querySelector('#archive-query'),author=d.querySelector('#archive-author'),book=d.querySelector('#archive-book'),random=d.querySelector('[data-random-thought]');const change=(node,value)=>{node.value=value;node.dispatchEvent(new w.Event('change',{bubbles:true}));};const wait=async()=>{for(let i=0;i<4;i++){await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const running=d.getAnimations();if(!running.length)break;await Promise.allSettled(running.map(a=>a.finished));}};try{change(author,'jules-payot');check('Author filter: five Payot entries',d.querySelectorAll('[data-archive-entry]:not([hidden])').length===5);change(book,'irade-terbiyesi');random.scrollIntoView({block:'center',behavior:'instant'});random.focus();random.click();await wait();const first=d.querySelector('[data-selected-entry]').dataset.selectedEntry;check('Discovery respects filter',first.startsWith('irade-terbiyesi'));random.click();await wait();const second=d.querySelector('[data-selected-entry]').dataset.selectedEntry;check('No consecutive repeat',first!==second);for(let i=0;i<6;i++)random.click();await wait();check('Rapid click stays in filter',d.querySelector('[data-selected-entry]').dataset.selectedEntry.startsWith('irade-terbiyesi'));check('Focus remains on discover button',d.activeElement===random);check('Animations settle',d.getAnimations().length===0);change(input,'zxq-no-result');check('Empty results and random disabled',d.querySelectorAll('[data-archive-entry]:not([hidden])').length===0&&random.disabled);check('Filter hides stale discovery',d.querySelector('.discovery-card').hidden);change(input,'');change(author,'');change(book,'');change(input,'İRADE');check('Turkish search',d.querySelectorAll('[data-archive-entry]:not([hidden])').length===7);change(input,'');const details=d.querySelector('.thought-card details');details.open=true;await wait();check('Native details source opens',details.open&&details.querySelector('.thought-details').getBoundingClientRect().height>0);details.open=false;await wait();check('Native details closes',!details.open);check('No page errors',w.__pageErrors.length===0);el('result').textContent=JSON.stringify({total:rows.length,failed:rows.filter(r=>!r.passed),rows});}catch(error){el('result').textContent=JSON.stringify({error:String(error),rows});}};

el('scenes').onclick=async()=>{const rows=[];for(const page of ['index.html','machiavelli.html'])for(const width of [390,1440])for(const height of [480,640,900]){el('height').value=height;const d=await load(page,width,'dark');const w=d.defaultView,s=d.querySelector('[data-story]');for(let i=0;i<3;i++){const part=s.querySelectorAll('[data-story-scene]')[i];part.scrollIntoView({block:'start',behavior:'instant'});await settle(d);const animations=w.__motionLog;rows.push({page,width,height,step:i,mode:s.dataset.storyMode,state:s.dataset.scene,active:d.getAnimations().length,layout:inspect(d),local:animations.filter(a=>a.owner===part.id).map(a=>a.target),offscreenStarts:animations.filter(a=>a.top>=a.height||a.bottom<=0),transforms:[...s.querySelectorAll('.story-visual [data-morph]')].map(e=>({target:e.className,transform:getComputedStyle(e).transform,opacity:getComputedStyle(e).opacity})),errors:w.__pageErrors});el('result').textContent=JSON.stringify({progress:rows.length,total:36});}}el('result').textContent=JSON.stringify({total:rows.length,failed:rows.filter(r=>r.offscreenStarts.length||r.errors.length||r.layout.documentWidth>r.width+1||r.active),rows});};
el('nojs-audit').onclick=async()=>{const rows=[];for(const page of ['index.html','dusunce-arsivi.html','hakkimda.html','machiavelli.html','irade-terbiyesi.html','rehberler.html'])for(const width of [390,1440]){const d=await load(page,width,'light',true);rows.push({page,width,...inspect(d),heading:d.querySelector('h1')?.textContent,quotes:d.querySelectorAll('[data-archive-entry]').length,hasMotionRuntime:!!d.defaultView.AG_MOTION});el('result').textContent=JSON.stringify({progress:rows.length,total:12});}el('result').textContent=JSON.stringify({total:rows.length,failed:rows.filter(r=>r.hiddenMain||r.documentWidth>r.width+1||r.hasMotionRuntime),rows});};
el('metrics').onclick=async()=>{const rows=[];el('height').value=900;el('reduced').checked=false;for(const width of [390,1440])for(let sample=1;sample<=3;sample++)for(const page of ['qa-baseline.html','index.html']){const d=await load(page,width,'light');await Promise.allSettled([...d.images].filter(img=>img.loading!=='lazy').map(img=>img.decode()));await settle(d);await new Promise(r=>setTimeout(r,250));rows.push({page,width,height:900,sample,...d.defaultView.__vitals});el('result').textContent=JSON.stringify({progress:rows.length,total:12});}el('result').textContent=JSON.stringify({mode:'Same preview origin, Chrome iframe, no network/CPU throttling, cache not cleared; not field Core Web Vitals',rows});};
</script></body></html>
